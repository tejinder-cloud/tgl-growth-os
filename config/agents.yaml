# The Growth Lab — Agent Directory
# Managed via scripts/new-agent.sh and People Ops

- name: chief-of-staff
  department: office-of-the-architect
  channel: "#standup"
  trigger: "Daily 09:00 plan dispatch, 17:50 IST compilation, 18:00 broadcast, 18:15 silence check, Monday 09:00 scorecard, mention @chief-of-staff"
  reviewer: "Architect"
  status: active
  daily_cost_cap_usd: 0.50
  routines:
    - name: daily_plan_dispatch
      frequency: daily
      schedule: "0 9 * * 1-5"
      description: "09:00 IST Morning plan dispatch from config/plan.yaml"
    - name: daily_standup_gather
      frequency: daily
      schedule: "50 17 * * *"
      description: "17:50 IST operational material gather & Anthropic synthesis"
    - name: daily_standup_broadcast
      frequency: daily
      schedule: "0 18 * * *"
      description: "18:00 IST broadcast digest to #standup & initiate thread"
    - name: daily_silence_check
      frequency: daily
      schedule: "15 18 * * *"
      description: "18:15 IST silence audit on active reporting agents"
    - name: monday_scorecard
      frequency: weekly
      schedule: "0 9 * * 1"
      description: "Monday 09:00 IST cross-door scorecard to #architect"
    - name: architect_intake_poll
      frequency: continuous
      schedule: "*/2 * * * *"
      description: "Poll #architect and bot DMs every 2 minutes for tasks, reports, questions, and decisions"

