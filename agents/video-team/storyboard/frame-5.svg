      <text x="0" y="28" fill="#6B625B" class="text-ui" font-size="8.5">Volume IV · NCLEX-RN &amp; Professional Nursing</text>

      <!-- Ruled Table Headers (Teal #2E6F65) -->
      <rect x="0" y="36" width="254" height="20" rx="3" fill="#2E6F65"/>
      <text x="8" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">SR</text>
      <text x="32" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">STUDENT NAME</text>
      <text x="130" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">BATCH</text>
      <text x="198" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">DATE</text>

      <!-- Row 1: Prior student -->
      <line x1="0" y1="84" x2="254" y2="84" stroke="#DDD6CA" stroke-width="1"/>
      <text x="8" y="76" fill="#6B625B" class="text-ui" font-size="8">083</text>
      <text x="32" y="76" fill="#6B625B" class="text-ui" font-size="8">Jaspreet Singh</text>
      <text x="130" y="76" fill="#6B625B" class="text-ui" font-size="8">Day Batch</text>
      <text x="198" y="76" fill="#6B625B" class="text-ui" font-size="8">16 Oct</text>

      <!-- Row 2: Simran Kaur (HERO HIGHLIGHTED ROW) -->
      <rect x="0" y="86" width="254" height="34" fill="#E8F2E4" stroke="#3D6B2C" stroke-width="1"/>
      <text x="8" y="106" fill="#3D6B2C" class="text-ui" font-size="9" font-weight="900">084</text>
      <text x="32" y="103" fill="#2C2118" class="text-ui" font-size="9.5" font-weight="800">Simran Kaur</text>
      <text x="32" y="114" fill="#3D6B2C" class="text-ui" font-size="7.5" font-weight="700">Jalandhar · Roll #26-084</text>
      <text x="130" y="106" fill="#2C2118" class="text-ui" font-size="8.5" font-weight="700">Night Batch</text>
      <text x="198" y="106" fill="#2C2118" class="text-ui" font-size="8.5" font-weight="700">18 Oct</text>
      <line x1="0" y1="120" x2="254" y2="120" stroke="#DDD6CA" stroke-width="1"/>

      <!-- Row 3: Next student -->
      <line x1="0" y1="150" x2="254" y2="150" stroke="#DDD6CA" stroke-width="1"/>
      <text x="8" y="142" fill="#6B625B" class="text-ui" font-size="8">085</text>
      <text x="32" y="142" fill="#6B625B" class="text-ui" font-size="8">Navneet K.</text>
      <text x="130" y="142" fill="#6B625B" class="text-ui" font-size="8">Weekend</text>
      <text x="198" y="142" fill="#6B625B" class="text-ui" font-size="8">18 Oct</text>
    </g>

    <!-- Right Page: Campaign Attribution & Closed Loop Truth -->
    <g transform="translate(336, 20)">
      <text x="0" y="16" fill="#2C2118" class="text-title" font-size="14" font-weight="700">Attribution &amp; Source Truth</text>
      <text x="0" y="28" fill="#6B625B" class="text-ui" font-size="8.5">Verified Ad Spend to Admission Connection</text>

      <!-- Table Header -->
      <rect x="0" y="36" width="250" height="20" rx="3" fill="#2E6F65"/>
      <text x="8" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">ORIGIN CAMPAIGN</text>
      <text x="130" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">SCORE</text>
      <text x="180" y="49" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="700">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="84" x2="250" y2="84" stroke="#DDD6CA" stroke-width="1"/>
      <text x="8" y="76" fill="#6B625B" class="text-ui" font-size="8">Meta_NCLEX_Direct</text>
      <text x="130" y="76" fill="#6B625B" class="text-ui" font-size="8">HOT · 88</text>
      <text x="180" y="76" fill="#3D6B2C" class="text-ui" font-size="8.5" font-weight="900">VERIFIED ✓</text>

      <!-- Row 2: Simran Kaur Attribution Highlight -->
      <rect x="0" y="86" width="250" height="34" fill="#E8F2E4" stroke="#3D6B2C" stroke-width="1"/>
      <text x="8" y="102" fill="#2C2118" class="text-ui" font-size="8.5" font-weight="800">Meta_NCLEX_Batch26</text>
      <text x="8" y="113" fill="#6B625B" class="text-ui" font-size="7">Ad ID: #7821 · Form #04</text>
      <text x="130" y="106" fill="#C75B3B" class="text-ui" font-size="8.5" font-weight="900">HOT · 84</text>
      <!-- Green Verified Seal -->
      <rect x="180" y="93" width="62" height="18" rx="4" fill="#3D6B2C"/>
      <text x="211" y="105" fill="#FFFFFF" class="text-ui" font-size="7.5" font-weight="900" text-anchor="middle">ENROLLED ✓</text>
      <line x1="0" y1="120" x2="250" y2="120" stroke="#DDD6CA" stroke-width="1"/>

      <!-- Row 3 -->
      <line x1="0" y1="150" x2="250" y2="150" stroke="#DDD6CA" stroke-width="1"/>
      <text x="8" y="142" fill="#6B625B" class="text-ui" font-size="8">IG_DM_Organic</text>
      <text x="130" y="142" fill="#6B625B" class="text-ui" font-size="8">WARM · 64</text>
      <text x="180" y="142" fill="#3D6B2C" class="text-ui" font-size="8.5" font-weight="900">VERIFIED ✓</text>

      <!-- Verification Seal Box -->
      <g transform="translate(14, 170)">
        <rect x="0" y="0" width="222" height="60" rx="6" fill="#FAF6F0" stroke="#DDD6CA" stroke-width="1"/>
        <text x="12" y="20" fill="#2C2118" class="text-ui" font-size="9" font-weight="800">The Ledger Does Not Lie.</text>
        <text x="12" y="34" fill="#6B625B" class="text-ui" font-size="8">Every rupee spent on Meta is matched to a physical entry in this book.</text>
        <text x="12" y="48" fill="#C75B3B" class="text-ui" font-size="8" font-weight="800">Attribution Verified · Ready for Feedback Loop ↺</text>
      </g>
    </g>
