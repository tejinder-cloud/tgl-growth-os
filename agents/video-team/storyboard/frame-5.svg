  <!-- 6. Bottom Voiceover / Subtitle Card -->
  <g transform="translate(48, 436)">
    <rect x="0" y="0" width="864" height="54" rx="12" fill="#EDE8DD" stroke="#DDD6CA" stroke-width="1"/>
    <text x="24" y="24" fill="#6B625B" class="text-ui" font-size="9" font-weight="700" letter-spacing="0.5">VOICEOVER (1:00 – 1:15)</text>
    <text x="24" y="42" fill="#2C2118" class="text-title" font-size="13" font-style="italic">"Thursday morning. Simran walks into the branch. Documents verified. Fees deposited. Admission entered in the register. That is the only number that matters. Not clicks. Not cost per lead. Enrolled students."</text>
  </g>
</svg>
