<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen-print Misregistration Shadow Layer (2px offset terracotta/coral) -->
  <rect x="20" y="16" width="82" height="92" rx="4" fill="#E8846B" opacity="0.35"/>
  <!-- Base Paper Slip Layer (Cream) -->
  <rect x="18" y="14" width="82" height="92" rx="4" fill="#FFFFFF" stroke="#2C2118" stroke-width="1.75"/>
  
  <!-- Pin / Paperclip Accent -->
  <path d="M30 11V22C30 24 33 24 33 22V9C33 6 27 6 27 9V24" stroke="#2C2118" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Slip Header / Lines -->
  <rect x="38" y="24" width="48" height="4" rx="2" fill="#2C2118"/>
  <rect x="38" y="32" width="32" height="3" rx="1.5" fill="#6B625B"/>
  <line x1="28" y1="42" x2="90" y2="42" stroke="#DDD6CA" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Field Rows -->
  <rect x="28" y="48" width="24" height="3" rx="1.5" fill="#2C2118" opacity="0.7"/>
  <rect x="28" y="55" width="40" height="3" rx="1.5" fill="#6B625B"/>
  <rect x="28" y="63" width="18" height="3" rx="1.5" fill="#2C2118" opacity="0.7"/>
  <rect x="28" y="70" width="34" height="3" rx="1.5" fill="#6B625B"/>

  <!-- TrueLead Stamped Badge: HOT · 94 (Angled print stamp) -->
  <g transform="rotate(-7 74 82)">
    <!-- Stamp shadow offset -->
    <rect x="52" y="72" width="38" height="18" rx="3" fill="#E8846B" opacity="0.4"/>
    <!-- Stamp border and fill -->
    <rect x="50" y="70" width="38" height="18" rx="3" fill="#FAF6F0" stroke="#C75B3B" stroke-width="1.75"/>
    <text x="69" y="83" fill="#C75B3B" font-family="'DM Sans', -apple-system, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.5" text-anchor="middle">HOT · 94</text>
  </g>
</svg>
